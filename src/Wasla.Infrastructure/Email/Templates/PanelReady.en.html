<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Wasla restaurant panel is ready</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222222; max-width: 600px; margin: 0 auto; padding: 24px;">
  <h2 style="color: #0d6efd;">Wasla</h2>

  <p>Hello {{OwnerFullName}},</p>

  <p>Your restaurant panel has been created successfully.</p>

  <p><strong>Your panel address:</strong></p>

  <p style="margin: 16px 0;">
    <a href="{{LoginUrl}}" style="background-color: #0d6efd; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 4px; display: inline-block;">
      Open Panel
    </a>
  </p>

  <p style="color: #555555;">{{LoginUrl}}</p>

  <p>You can use this address to sign in to your Wasla restaurant panel.</p>

  <hr style="border: none; border-top: 1px solid #eeeeee; margin: 24px 0;" />

  <p style="color: #888888; font-size: 13px;">{{FromName}}</p>
</body>
</html>
