# /etc/nginx/sites-available/wasla-https (WAS-76). TLS ends here; Wasla.Web listens on 127.0.0.1:5200 only.
# Enabled after the certificate /etc/letsencrypt/live/wasla.tr exists. Wasla.Api is not published: it serves
# tenant JSON only on {slug}.app.wasla.tr (the hosts below go to Web) and Print Bridge uses Web.
#
# Host handling: the original Host header goes to Web unchanged, because tenants are resolved from it and
# X-Forwarded-Host is never applied. X-Forwarded-For and X-Forwarded-Proto are applied by Web only because
# TrustedProxies__KnownProxies__0=127.0.0.1 is set (docs/operations/deployment.md#reverse-proxy-and-client-address).
# Web classifies every host itself: an invalid or unknown tenant host gets tenant-not-found, never another tenant.

map $http_upgrade $wasla_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream wasla_web {
    server 127.0.0.1:5200;
    keepalive 16;
}

# www.wasla.tr is the marketing apex's alias: one permanent redirect, no application request.
server {
    listen 443 ssl;
    server_name www.wasla.tr;

    ssl_certificate /etc/letsencrypt/live/wasla.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasla.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wasla.tr$request_uri;
}

server {
    listen 443 ssl;
    server_name wasla.tr app.wasla.tr *.app.wasla.tr;

    ssl_certificate /etc/letsencrypt/live/wasla.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wasla.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/wasla.access.log;
    error_log /var/log/nginx/wasla.error.log;

    # Logo uploads: Web accepts requests up to 8 MiB and images up to 1 MiB, and explains a rejected image itself.
    client_max_body_size 8m;

    # Every location sets its own proxy_set_header lines: a location with any of them inherits none from here.
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Web does not serve /internal/ on its public port; the loopback channel has its own port (5290).
    location ^~ /internal/ {
        return 404;
    }

    # SignalR hub: WebSocket upgrade, keep-alives every 15 s, Server-Sent Events fallback without buffering.
    location /hubs/ {
        proxy_pass http://wasla_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wasla_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://wasla_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
