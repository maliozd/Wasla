# /etc/nginx/sites-available/wasla-http (WAS-76). Port 80 for the Wasla hosts: Let's Encrypt HTTP-01 challenges
# from a webroot, everything else redirected permanently to HTTPS. Enabled before the certificate exists.
# Only these names reach Wasla; any other host keeps going to the server's other sites or Nginx's default.
server {
    listen 80;
    server_name wasla.tr www.wasla.tr app.wasla.tr *.app.wasla.tr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
